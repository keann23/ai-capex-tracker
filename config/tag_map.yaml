# Standard line item -> candidate us-gaap tags, in priority order (first tag with a value for that period wins).
items:
  revenue:
    type: flow
    tags: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, SalesRevenueNet]
  cost_of_revenue:
    type: flow
    tags: [CostOfRevenue, CostOfGoodsAndServicesSold]
  gross_profit:
    type: flow
    tags: [GrossProfit]
    derive: revenue - cost_of_revenue
  operating_income:
    type: flow
    tags: [OperatingIncomeLoss]
  depreciation:
    # Depreciation of property & equipment only: the right comparison for the
    # capex depreciation model (excludes intangibles, content, lease amortization).
    # Alphabet only tags this from FY2021; earlier quarters are missing in companyfacts.
    type: flow
    tags: [Depreciation]
  depreciation_amortization:
    # Total D&A as reported. Broader than depreciation (Amazon includes video content).
    type: flow
    tags: [DepreciationDepletionAndAmortization, DepreciationAndAmortization, DepreciationAmortizationAndOther, Depreciation]
  cfo:
    type: flow
    tags: [NetCashProvidedByUsedInOperatingActivities]
  capex:
    type: flow
    # Amazon also reports finance-lease property acquisitions; note in UI if excluded
    tags: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
  ppe_gross:
    type: instant
    tags: [PropertyPlantAndEquipmentGross]
  ppe_net:
    type: instant
    tags: [PropertyPlantAndEquipmentNet]
  free_cash_flow:
    type: flow
    tags: []
    derive: cfo - capex
